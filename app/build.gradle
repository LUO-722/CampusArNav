plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// 云端通道（DashScope 的 OpenAI 兼容接口）的 Key 从本机 local.properties 读取，编译期注入 BuildConfig；
// 界面里不出现任何地址或 Key 的配置项。
def aiProps = new Properties()
def aiFile = rootProject.file("local.properties")
if (aiFile.exists()) aiFile.withInputStream { aiProps.load(it) }
def aiKey = aiProps.getProperty("dashscope.key", System.getenv("DASHSCOPE_KEY") ?: "")
def aiBase = aiProps.getProperty("dashscope.base", "https://dashscope.aliyuncs.com/compatible-mode/v1")
def aiModels = aiProps.getProperty("dashscope.models",
        "qwen-max,qwen-plus,qwen-flash,deepseek-v4.1-flash,deepseek-v4-flash-0731,qwen-long")
def aiVisionModels = aiProps.getProperty("dashscope.vision_models", "qwen3-vl-plus")

android {
    namespace 'com.campus.arnav'
    compileSdk 36

    defaultConfig {
        applicationId "com.campus.arnav"
        minSdk 24
        targetSdk 36
        versionCode 85
        versionName "0.26.0"

        buildConfigField "String", "DASHSCOPE_KEY", "\"${aiKey}\""
        buildConfigField "String", "DASHSCOPE_BASE", "\"${aiBase}\""
        buildConfigField "String", "DASHSCOPE_MODEL", "\"${aiModels.split(",")[0].trim()}\""
        buildConfigField "String", "DASHSCOPE_MODELS", "\"${aiModels}\""
        buildConfigField "String", "DASHSCOPE_VISION_MODEL", "\"${aiVisionModels.split(",")[0].trim()}\""
        buildConfigField "String", "DASHSCOPE_VISION_MODELS", "\"${aiVisionModels}\""

        // 只打 arm64 一份 native 库：ML Kit 的 so 很大，打包全部 ABI 会让安装包翻倍。
        // 代价是 x86 模拟器装不上。
        ndk { abiFilters 'arm64-v8a' }
    }

    // 发布签名材料放项目根并被 .gitignore 忽略；没有这两个文件时不创建 release 配置，
    // 因此 assembleDebug 不受影响。对外分发仍用 debug 签名，保证覆盖安装不丢本地数据。
    signingConfigs {
        if (rootProject.file("keystore.properties").exists()) {
            release {
                def ksProps = new Properties()
                rootProject.file("keystore.properties").withInputStream { ksProps.load(it) }
                storeFile rootProject.file(ksProps.getProperty("storeFile"))
                storePassword ksProps.getProperty("storePassword")
                keyAlias ksProps.getProperty("keyAlias")
                keyPassword ksProps.getProperty("keyPassword")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (rootProject.file("keystore.properties").exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        buildConfig true
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'

    def camerax = '1.4.2'
    implementation "androidx.camera:camera-core:$camerax"
    implementation "androidx.camera:camera-camera2:$camerax"
    implementation "androidx.camera:camera-lifecycle:$camerax"
    implementation "androidx.camera:camera-view:$camerax"

    // 本机文字识别：模型随包分发，不联网也不上传图片
    implementation 'com.google.mlkit:text-recognition-chinese:16.0.1'
}
