plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.campus.arnav'
    compileSdk 36

    defaultConfig {
        applicationId "com.campus.arnav"
        minSdk 24
        targetSdk 36
        versionCode 33
        versionName "0.11.3"

        // 内置云端通道（阿里云百炼 / DashScope OpenAI 兼容）。
        // Key 只从本机 local.properties 读取，编译进包，界面上不出现任何接口/Key 配置。
        def aiProps = new Properties()
        def aiFile = rootProject.file("local.properties")
        if (aiFile.exists()) { aiFile.withInputStream { aiProps.load(it) } }
        def aiKey = aiProps.getProperty("dashscope.key", System.getenv("DASHSCOPE_KEY") ?: "")
        def aiBase = aiProps.getProperty("dashscope.base", "https://dashscope.aliyuncs.com/compatible-mode/v1")
        def aiModels = aiProps.getProperty("dashscope.models", "qwen-plus,qwen-max,qwen-flash,qwen-long,qwen3-vl-plus")
        def aiModel = aiModels.split(",")[0].trim()
        buildConfigField "String", "DASHSCOPE_KEY", "\"${aiKey}\""
        buildConfigField "String", "DASHSCOPE_BASE", "\"${aiBase}\""
        buildConfigField "String", "DASHSCOPE_MODEL", "\"${aiModel}\""
        buildConfigField "String", "DASHSCOPE_MODELS", "\"${aiModels}\""
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        buildConfig true
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'

    def camerax = '1.4.2'
    implementation "androidx.camera:camera-core:$camerax"
    implementation "androidx.camera:camera-camera2:$camerax"
    implementation "androidx.camera:camera-lifecycle:$camerax"
    implementation "androidx.camera:camera-view:$camerax"

    // 本机离线 OCR：ML Kit 中文文字识别（模型随 APK 打包，不联网、不上传图片、无需 Key）
    implementation 'com.google.mlkit:text-recognition-chinese:16.0.1'
}
