plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.campus.arnav'
    compileSdk 36

    defaultConfig {
        applicationId "com.campus.arnav"
        minSdk 24
        targetSdk 36
        versionCode 52
        versionName "0.19.4"

        // 内置云端通道（阿里云百炼 / DashScope OpenAI 兼容）。
        // Key 只从本机 local.properties 读取，编译进包，界面上不出现任何接口/Key 配置。
        def aiProps = new Properties()
        def aiFile = rootProject.file("local.properties")
        if (aiFile.exists()) { aiFile.withInputStream { aiProps.load(it) } }
        def aiKey = aiProps.getProperty("dashscope.key", System.getenv("DASHSCOPE_KEY") ?: "")
        def aiBase = aiProps.getProperty("dashscope.base", "https://dashscope.aliyuncs.com/compatible-mode/v1")
        def aiModels = aiProps.getProperty("dashscope.models", "qwen-plus,qwen-max,qwen-flash,qwen-long,qwen3-vl-plus")
        def aiModel = aiModels.split(",")[0].trim()
        buildConfigField "String", "DASHSCOPE_KEY", "\"${aiKey}\""
        buildConfigField "String", "DASHSCOPE_BASE", "\"${aiBase}\""
        buildConfigField "String", "DASHSCOPE_MODEL", "\"${aiModel}\""
        buildConfigField "String", "DASHSCOPE_MODELS", "\"${aiModels}\""
    def aiVisionModels = aiProps.getProperty("dashscope.vision_models", "qwen3-vl-plus")
    buildConfigField "String", "DASHSCOPE_VISION_MODEL", "\"${aiVisionModels.split(',')[0].trim()}\""
    buildConfigField "String", "DASHSCOPE_VISION_MODELS", "\"${aiVisionModels}\""

        // 高德地图 Key：同样只从本机 local.properties 读取（没有就空串，界面用 AmapEnv.ready() 降级）。
        // Manifest 里的 <meta-data android:name="com.amap.api.v2.apikey" android:value="${AMAP_KEY}"/> 靠这里替换。
        def amapKey = aiProps.getProperty("amap.key", System.getenv("AMAP_KEY") ?: "")
        manifestPlaceholders = [AMAP_KEY: amapKey]
        buildConfigField "String", "AMAP_KEY", "\"${amapKey.replace("\\", "\\\\").replace("\"", "\\\"")}\""

        // 只用 arm64：高德 so 双 ABI 占 33MB，本机（2510DRK44C）是 arm64，去掉 armeabi-v7a 省 13MB。
        ndk { abiFilters 'arm64-v8a' }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        buildConfig true
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'

    def camerax = '1.4.2'
    implementation "androidx.camera:camera-core:$camerax"
    implementation "androidx.camera:camera-camera2:$camerax"
    implementation "androidx.camera:camera-lifecycle:$camerax"
    implementation "androidx.camera:camera-view:$camerax"

    // 本机离线 OCR：ML Kit 中文文字识别（模型随 APK 打包，不联网、不上传图片、无需 Key）
    implementation 'com.google.mlkit:text-recognition-chinese:16.0.1'

    // 高德地图 SDK（3dmap 这个包同时提供 2D 地图展示）。
    // 版本固定 10.0.600：这是腾讯云镜像与阿里云 public 上真实存在的最新版（2024-03 发布），
    // 可用性探测见 _amap_skeleton.md。Key 不写在这里，运行时由 AmapEnv 读 BuildConfig。
    implementation 'com.amap.api:3dmap:10.0.600'
}
